name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        run: composer run lint

      - name: Static analysis (PHPStan level 8)
        run: composer run types

      - name: Static analysis (Domain, level 9)
        run: composer run types:domain

      - name: Rector dry-run
        run: composer run refactor

      - name: Security audit
        run: composer audit --no-interaction

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Type check
        run: npm run types
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # No service containers: phpunit.xml pins the suite to SQLite in memory,
    # with array cache/session and a sync queue, so nothing reaches out to
    # Postgres or Redis. Keep it that way — a job that needs a service is a
    # job the mutation run cannot share.

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Architecture tests
        run: composer run test:arch

      - name: Test suite with coverage
        run: composer run test:cov

      - name: Type coverage
        run: composer run test:type

  mutation:
    name: Mutation testing (money-critical)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Mutation score (Pricing + Cod)
        run: composer run test:mutate
