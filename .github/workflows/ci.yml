name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        run: composer run lint

      - name: Static analysis (PHPStan level 8)
        run: composer run types

      - name: Static analysis (Domain, level 9)
        run: composer run types:domain

      - name: Rector dry-run
        run: composer run refactor

      - name: Security audit
        run: composer audit --no-interaction

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Type check
        run: npm run types
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # No service containers: phpunit.xml pins the suite to SQLite in memory,
    # with array cache/session and a sync queue, so nothing reaches out to
    # Postgres or Redis. Keep it that way — a job that needs a service is a
    # job the mutation run cannot share.

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Architecture tests
        run: composer run test:arch

      - name: Test suite with coverage
        run: composer run test:cov

      - name: Type coverage
        run: composer run test:type

  # The fast suite runs on SQLite so no PR needs a service container. That
  # speed has a cost: SQLite's LIKE is case-insensitive and PostgreSQL's is
  # not, which once let a broken product search ship with a green build.
  # This job runs the same suite against the real engine on the long-lived
  # branches, where a slower check is worth the dialect coverage.
  tests-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bachatgali_test
          POSTGRES_USER: bachatgali
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U bachatgali"
          --health-interval=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Test suite against PostgreSQL 17
        run: vendor/bin/pest
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: bachatgali_test
          DB_USERNAME: bachatgali
          DB_PASSWORD: secret

  mutation:
    name: Mutation testing (money-critical)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Mutation score (Pricing + Cod)
        run: composer run test:mutate
